## use inverted to invert destruction behavior ie DistressSignal removes on all modes except DistressSignal

# Backwards-compat shim: LV624 map references this legacy id. The wall stays put on Distress Signal.
- type: entity
  id: rockwallremovein
  parent: CMWallRock

# Wall removes for various presets
- type: entity
  id: rockwallremoveinssolaris_distresssignal
  suffix: DistressSignal
  parent: CMWallSolarisRock
  components:
    - type: DestroyOnPreset
      preset: DistressSignal

