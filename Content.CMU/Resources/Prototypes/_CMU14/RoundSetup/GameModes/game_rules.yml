- type: entity
  id: AddGovforCorrespondent
  parent: BaseGameRule
  name: Add Combat Reporter
  components:
  - type: AddJobsRule
    addToShip: true
    shipFaction: govfor
    jobs:
      AU14JobGOVFORCombatCorrespondent: 1

- type: entity
  id: AuVoteRule
  parent: BaseGameRule
  name: Start Game Votes
  description: Loads AU/CMU round votes, planets, platoons, and bioscan.
  components:
  - type: AuVoteRule
  - type: Bioscan

- type: entity
  id: RemoveAllJobs
  parent: BaseGameRule
  name: Remove All Jobs
  description: Removes all jobs on the planet's main station prior to round start. Optionally removes jobs on ship stations.
  components:
  - type: RemoveJobsRule
